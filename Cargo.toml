[package]
name = "joycast"
version = "0.2.0"
edition = "2024"
description = "High-performance low-latency P2P gamepad and input device forwarder over iroh"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "joycast"
path = "src/lib.rs"

[[bin]]
name = "joycast"
path = "src/main.rs"

[dependencies]
iroh = "1.0"
evdev = { version = "0.13", features = ["tokio", "serde", "stream-trait"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1", features = ["alloc"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
rand = "0.8"
dirs-next = "2.0"
hex = "0.4"
gethostname = "1.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
