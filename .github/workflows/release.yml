name: Release & Build Binaries

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  release:
    types: [published, created]

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: joycast-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: joycast-linux-arm64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: joycast-linux-arm64-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl build tools
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin joycast

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/joycast dist/joycast
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist joycast

      - name: Upload build artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          retention-days: 30

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.tar.gz
